# CI (T40): cada PR y cada push a main/develop corre ruff y pytest.
# Sin red a Kaggle ni data oficial: las pruebas que la necesitan se saltan solas.
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-app.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt -r requirements-dev.txt

      - name: ruff
        run: ruff check --output-format github .

      - name: pytest
        run: pytest -q
