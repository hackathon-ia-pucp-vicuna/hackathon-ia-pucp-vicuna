# Localidades del Callejón de Huaylas (T14 · HU-07). Coordenadas aproximadas de la plaza principal.
# fila, columna y elevacion_dem_m son la celda de la grilla de 3 km (fila 0 = sur) y la altura del DEM.
# Se calculan con data/static.npz:  python app/frost/zonas.py
# Ojo: elevacion_dem_m es el promedio de la celda de 3 km (fondo de valle + laderas), por eso supera
# en 140–490 m la altura de la plaza (Huaraz ~3,050 m, Carhuaz ~2,650 m, Yungay ~2,460 m).
# Cada localidad queda a menos de 2 km del centro de su celda (máximo posible: 2.1 km, media diagonal).

